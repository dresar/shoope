<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Affiliate Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #fff; width: 320px; padding: 16px; margin: 0; }
    .header-box { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .logo-badge { background: #ea580c; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .btn-action-main {
      width: 100%; background: linear-gradient(135deg, #ea580c, #f97316); color: #fff; border: none;
      padding: 12px 14px; border-radius: 10px; font-weight: 800; font-size: 0.88rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35); transition: all 0.2s;
    }
    .btn-action-main:hover { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(234, 88, 12, 0.5); }
    .btn-action-sub {
      width: 100%; background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 0.82rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
    }
    .btn-action-sub:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .info-card {
      background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px; padding: 10px 12px; font-size: 0.76rem; color: #94a3b8; line-height: 1.45;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header-box">
    <div class="logo-badge">⚡</div>
    <div>
      <div style="font-weight: 800; font-size: 0.95rem; color: #fff;">Shopee Affiliate</div>
      <div style="font-size: 0.72rem; color: #ea580c; font-weight: 700;">5-in-1 Mass Automator</div>
    </div>
  </div>

  <button class="btn-action-main" id="btn-open-customlink">
    <span>🚀</span>
    <span>Buka Shopee Custom Link</span>
  </button>

  <button class="btn-action-sub" id="btn-open-biolink">
    <span>🛍️</span>
    <span>Buka Bio-Link Shop</span>
  </button>

  <div class="info-card">
    <strong style="color: #38bdf8;">💡 Fitur In-Page Widget:</strong><br>
    Saat membuka halaman Custom Link Shopee, widget kontrol melayang akan otomatis muncul di pojok kanan atas untuk auto-paste 5 link per putaran!
  </div>

  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
